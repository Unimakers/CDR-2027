; RB_esp32: firmware of the main robot on the "body v1" board (Seeed XIAO ESP32-S3 Plus).
; Ported from Firmware_Robot_Principale (ESP32-S3-DevKitC-1 board).
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; Serial = native USB CDC (GPIO43/44 stay free for the LD06 on Serial1)
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	gin66/FastAccelStepper@^2.0.0
	adafruit/Adafruit PWM Servo Driver Library@^3.0.3
